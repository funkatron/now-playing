<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Now Playing</title>
  <style>
    :root {
      --bg: #060709;
      --bg-2: #11161b;
      --panel: rgba(10, 12, 15, 0.84);
      --panel-edge: rgba(255, 255, 255, 0.08);
      --text: #f4efe4;
      --muted: #aea79b;
      --soft: #7e7a73;
      --accent: #c7462d;
      --accent-soft: rgba(199, 70, 45, 0.2);
      --glow: rgba(199, 70, 45, 0.16);
      --art-bg: linear-gradient(145deg, #191b1f, #08090b);
      --font-iosevka:
        "Iosevka Aile",
        "Iosevka Etoile",
        "Iosevka Curly",
        "Iosevka Curly Slab",
        "Iosevka Slab",
        "Iosevka Term",
        "Iosevka Fixed",
        "Iosevka",
        "Iosevka Nerd Font",
        "IosevkaTerm Nerd Font",
        "IosevkaTerm NFM",
        "Iosevka NFM",
        monospace;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(199, 70, 45, 0.18), transparent 28%),
        radial-gradient(circle at 85% 20%, rgba(73, 86, 104, 0.2), transparent 24%),
        linear-gradient(160deg, var(--bg) 0%, #0d1116 46%, #13181f 100%);
      color: var(--text);
      font-family: var(--font-iosevka);
      overflow-x: hidden;
      overflow-y: auto;
    }
    body, button, input, textarea, select {
      font-family: var(--font-iosevka);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01)),
        repeating-linear-gradient(
          180deg,
          transparent 0,
          transparent 3px,
          rgba(255, 255, 255, 0.015) 4px
        );
      mix-blend-mode: soft-light;
      opacity: 0.55;
    }
    .shell {
      min-height: 100vh;
      display: grid;
      align-items: start;
      justify-items: center;
      padding: clamp(18px, 4vh, 40px) 20px 24px;
      box-sizing: border-box;
    }
    .card {
      position: relative;
      width: min(1120px, 100%);
      box-sizing: border-box;
      border-radius: 30px;
      padding: 24px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), transparent 18%),
        var(--panel);
      border: 1px solid var(--panel-edge);
      box-shadow:
        0 38px 90px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.03) inset,
        0 0 90px var(--glow);
      backdrop-filter: blur(14px);
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(199, 70, 45, 0.55), transparent 35%, rgba(255,255,255,0.08));
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.7;
    }
    .masthead {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 18px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 11px;
      color: var(--muted);
    }
    .brand {
      display: inline-flex;
      gap: 10px;
      align-items: center;
    }
    .brand-mark {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 18px rgba(199, 70, 45, 0.7);
    }
    .brand-copy {
      display: flex;
      gap: 10px;
      align-items: baseline;
    }
    .brand-copy strong {
      color: var(--text);
      font-weight: 700;
    }
    .signal {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      color: var(--soft);
    }
    .grid {
      display: grid;
      gap: 22px;
      grid-template-columns: minmax(280px, 380px) minmax(0, 1fr);
      align-items: start;
    }
    .artwork {
      aspect-ratio: 1;
      border-radius: 24px;
      overflow: hidden;
      background: var(--art-bg);
      display: grid;
      grid-template: 1fr / 1fr;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.03),
        0 20px 50px rgba(0, 0, 0, 0.35);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 11px;
      position: relative;
    }
    .artwork::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.08), transparent 24%),
        linear-gradient(135deg, transparent 45%, rgba(199, 70, 45, 0.14));
      pointer-events: none;
    }
    .artwork > * {
      grid-area: 1 / 1;
    }
    .artwork img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      position: relative;
      z-index: 1;
    }
    .content {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      min-width: 0;
    }
    .kicker {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.22em;
      font-size: 12px;
    }
    .title {
      margin-top: 12px;
      font-size: clamp(40px, 6vw, 84px);
      line-height: 1.05;
      font-weight: 800;
      font-family: var(--font-iosevka);
      letter-spacing: -0.08em;
      text-wrap: balance;
      overflow-wrap: break-word;
      word-break: break-word;
      min-width: 0;
    }
    .meta {
      margin-top: 10px;
      color: #d8d1c2;
      font-size: clamp(18px, 2vw, 24px);
      max-width: 30ch;
    }
    .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 18px;
    }
    .status {
      display: inline-flex;
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      color: var(--text);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .state-playing {
      background: var(--accent-soft);
      border-color: rgba(199, 70, 45, 0.35);
      color: #ffd6cf;
    }
    .state-idle, .state-not_running {
      color: var(--muted);
    }
    .details {
      display: grid;
      gap: 12px;
      margin-top: 20px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      min-width: 0;
    }
    .detail {
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .detail-label {
      display: block;
      color: var(--soft);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 10px;
      margin-bottom: 6px;
    }
    .detail-value {
      color: var(--text);
      font-size: 15px;
      word-break: break-word;
      overflow-wrap: anywhere;
      font-family: var(--font-iosevka);
    }
    .footer-note {
      margin-top: 18px;
      color: var(--soft);
      font-size: 12px;
      letter-spacing: 0.06em;
    }
    .providers {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }
    .provider-card {
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .provider-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      margin-bottom: 6px;
    }
    .provider-name {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 11px;
    }
    .provider-state {
      color: var(--text);
      font-size: 13px;
      text-transform: uppercase;
    }
    .provider-detail {
      color: var(--soft);
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .provider-error {
      color: #ffb4a5;
    }
    @media (min-width: 961px) {
      .content {
        padding-right: 8px;
      }
    }
    @media (max-width: 960px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .meta {
        max-width: none;
      }
      .details {
        grid-template-columns: 1fr;
      }
    }
    @media (max-width: 680px) {
      .shell {
        padding: 14px;
      }
      .card {
        padding: 16px;
        border-radius: 22px;
      }
      .masthead {
        margin-bottom: 14px;
      }
      .title {
        font-size: clamp(34px, 11vw, 56px);
        letter-spacing: -0.05em;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <main class="card">
      <div class="masthead">
        <div class="brand">
          <span class="brand-mark"></span>
          <div class="brand-copy">
            <strong>Funkatron</strong>
            <span>/ Dead Agent signal</span>
          </div>
        </div>
        <div class="signal">Local viewer / SSE live feed</div>
      </div>
      <div class="grid">
        <div class="artwork">
          <img id="artwork-image" alt="Current artwork">
          <div id="artwork-empty">No Artwork</div>
        </div>
        <section class="content">
          <div class="kicker">Now Playing</div>
          <div id="title" class="title">Waiting for playback</div>
          <div id="meta" class="meta">Start Apple Music or Spotify and press play.</div>
          <div class="status-row"><div id="status" class="status">idle</div></div>
          <div class="details">
            <div class="detail">
              <span class="detail-label">Source</span>
              <span id="source" class="detail-value">unknown</span>
            </div>
            <div class="detail">
              <span class="detail-label">Updated</span>
              <span id="updated-at" class="detail-value">never</span>
            </div>
          </div>
          <div id="providers" class="providers"></div>
          <div class="footer-note">Live local feed for stream overlays, OBS, and operator checks.</div>
        </section>
      </div>
    </main>
  </div>
  <script>
    const endpointPrefix = "__ENDPOINT_PREFIX__";
    const useSse = __USE_SSE__;
    const titleEl = document.getElementById("title");
    const metaEl = document.getElementById("meta");
    const statusEl = document.getElementById("status");
    const sourceEl = document.getElementById("source");
    const updatedAtEl = document.getElementById("updated-at");
    const artworkImageEl = document.getElementById("artwork-image");
    const artworkEmptyEl = document.getElementById("artwork-empty");
    const providersEl = document.getElementById("providers");
    let lastArtworkVersion = "";

    function endpoint(path) {
      return endpointPrefix + path;
    }

    function formatProviderName(name) {
      if (name === "apple_music") return "Apple Music";
      if (name === "spotify") return "Spotify";
      return name || "Unknown";
    }

    function renderProviders(payload) {
      const providers = payload.providers || {};
      const entries = Object.entries(providers);
      if (!entries.length) {
        providersEl.innerHTML = "";
        return;
      }
      providersEl.innerHTML = entries.map(([name, info]) => {
        const detailClass = info.error ? "provider-detail provider-error" : "provider-detail";
        const detail = info.error || info.detail || "No additional detail";
        return `
          <div class="provider-card">
            <div class="provider-head">
              <span class="provider-name">${formatProviderName(name)}</span>
              <span class="provider-state">${info.state || "unknown"}</span>
            </div>
            <div class="${detailClass}">${detail}</div>
          </div>
        `;
      }).join("");
    }

    function render(payload) {
      sourceEl.textContent = payload.source || "unknown";
      updatedAtEl.textContent = payload.updated_at || "never";
      statusEl.textContent = payload.state || "unknown";
      statusEl.className = "status state-" + (payload.state || "unknown");
      renderProviders(payload);

      if (payload.state === "playing" && payload.title) {
        titleEl.textContent = payload.title;
        const parts = [payload.artist, payload.album, payload.year].filter(Boolean);
        metaEl.textContent = parts.join(" • ") || "Playing";
      } else {
        titleEl.textContent = "Waiting for playback";
        metaEl.textContent = "Start Apple Music or Spotify and press play.";
      }

      if (payload.artwork_path) {
        const version = payload.updated_at || payload.artwork_path;
        if (version !== lastArtworkVersion) {
          artworkImageEl.src = endpoint("/current_artwork.png") + "?v=" + encodeURIComponent(version);
          lastArtworkVersion = version;
        }
        artworkImageEl.style.display = "block";
        artworkEmptyEl.style.display = "none";
      } else {
        lastArtworkVersion = "";
        artworkImageEl.removeAttribute("src");
        artworkImageEl.style.display = "none";
        artworkEmptyEl.style.display = "block";
      }
    }

    async function fetchCurrent() {
      const response = await fetch(endpoint("/current"), { cache: "no-store" });
      if (!response.ok) {
        throw new Error("current fetch failed");
      }
      render(await response.json());
    }

    let events = null;
    let reconnectTimer = null;

    function scheduleReconnect() {
      if (!useSse || reconnectTimer !== null) {
        return;
      }
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        connectEvents();
      }, 2000);
    }

    function connectEvents() {
      if (!useSse) {
        return;
      }
      if (events) {
        events.close();
      }
      events = new EventSource(endpoint("/events"));
      events.addEventListener("now_playing", (event) => {
        render(JSON.parse(event.data));
      });
      events.onerror = () => {
        statusEl.textContent = "disconnected";
        if (events) {
          events.close();
          events = null;
        }
        scheduleReconnect();
      };
    }

    fetchCurrent().catch(() => {
      statusEl.textContent = "disconnected";
    });

    connectEvents();
    setInterval(() => {
      fetchCurrent().catch(() => {
        statusEl.textContent = "disconnected";
      });
    }, 5000);
  </script>
</body>
</html>
