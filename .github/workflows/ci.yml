name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python 3.12 and run tests
        run: |
          uv python install 3.12
          uv sync --python 3.12
          uv run --python 3.12 pytest

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (includes pyobjc on macOS) and run tests
        run: |
          uv python install 3.12
          uv sync --python 3.12
          uv run --python 3.12 pytest
