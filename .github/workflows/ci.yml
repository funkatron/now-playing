name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python and run tests
        run: |
          uv python install ${{ matrix.python-version }}
          uv sync --python ${{ matrix.python-version }}
          uv run --python ${{ matrix.python-version }} pytest

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (includes pyobjc on macOS) and run tests
        run: |
          uv sync
          uv run pytest
